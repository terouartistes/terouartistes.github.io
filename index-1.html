<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Térou artistes – la musique africaine, vendue par ceux qui la font</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f0;--card:#fff;--ink:#17203a;--mute:#5d6580;--line:#d9dccf;--gold:#e2a82e;--green:#1f7a4d;--on-gold:#17203a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#eef0f6;--mute:#a3abc4;--line:#2b3656;--green:#4fc08a}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#eef0f6;--mute:#a3abc4;--line:#2b3656;--green:#4fc08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
[hidden]{display:none!important}
.play{background:transparent;color:var(--ink);border:1px solid var(--line)}
.bb{display:flex;flex-direction:column;gap:6px}
.hb{display:flex;gap:8px}
.logo{font:800 20px "Bricolage Grotesque",sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:28px 0 22px}
.hero h1{font-size:clamp(34px,9vw,56px);font-weight:800}
.hero p{max-width:46ch;color:var(--mute);margin:14px 0 0}
.bar{height:6px;margin:22px 0 0;background:linear-gradient(90deg,var(--green) 33%,var(--gold) 33% 66%,#c8352f 66%);border-radius:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.track{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.track h3{font-size:18px}
.meta{color:var(--mute);font-size:14px}
.price{font-weight:600}
.buy{background:var(--gold);color:var(--on-gold)}
.buy[aria-pressed="true"]{background:var(--green);color:#fff}
section.artist{margin:34px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px}
section.artist h2{font-size:26px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
form button{margin-top:16px;width:100%;background:var(--green);color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;max-height:70%;overflow:auto}
.sheet.open{transform:none}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;max-width:90%}
#toast.show{opacity:1}
footer{padding:10px 0 40px;color:var(--mute);font-size:13px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<div class="wrap">
<header><span class="logo">Térou artistes</span><span class="hb"><button id="lang" aria-label="Language" style="background:transparent;color:var(--ink);border:1px solid var(--line)">EN</button><button id="cartBtn"></button></span></header>
<div class="hero">
<h1 data-k="h1"></h1>
<p data-k="hp"></p>
<div class="bar" aria-hidden="true"></div>
</div>
<div class="chips" id="chips" role="group" aria-label="Genres"></div>
<label for="cur" data-k="cur"></label><select id="cur"><option value="XOF">FCFA</option><option value="EUR">Euro (€)</option><option value="USD">Dollar ($)</option></select>
<main id="list"></main>

<section class="artist" id="artiste">
<h2 data-k="ah"></h2>
<p class="meta" data-k="ap"></p>
<form id="lf"><label for="ln" data-k="la"></label><input id="ln" required maxlength="40"><label for="lm" data-k="em"></label><input id="lm" type="email" required>
<label for="rl" data-k="rl"></label><select id="rl"><option value="artist" data-k="ra"></option><option value="beat" data-k="rb"></option></select>
<label for="pt" data-k="po"></label><select id="pt"><option>Wave</option><option>Orange Money</option><option value="Bank">Banque / Bank</option></select>
<label for="pp" data-k="pn"></label><input id="pp" inputmode="tel" required maxlength="20">
<p class="note" data-k="pot"></p><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" id="rt" required style="width:auto;margin-top:4px"><span data-k="rt"></span></label>
<p class="meta" id="fee"></p><button type="submit" data-k="acct"></button><p class="note" data-k="lnote"></p></form>
<div id="ap" hidden><p class="meta" id="fee2"></p><label for="apm" data-k="pm"></label><select id="apm"><option>Wave</option><option>Orange Money</option><option>Flutterwave</option><option>Paystack</option><option value="Carte">Carte bancaire / Bank card</option></select><label for="aph" data-k="phl" id="aphl"></label><input id="aph" inputmode="tel" maxlength="20"><button id="apay" data-k="payfee" style="width:100%;margin-top:14px;background:var(--green);color:#fff"></button></div>
<div id="me" hidden><p id="who" class="meta"></p><button id="out" data-k="out" style="background:transparent;color:var(--ink);border:1px solid var(--line)"></button></div>
<form id="form" hidden>
<label for="t" data-k="lt"></label><input id="t" required maxlength="60">
<label for="a" data-k="la"></label><input id="a" required maxlength="40">
<label for="c" data-k="lc"></label>
<select id="c"></select>
<label for="g" data-k="lg"></label>
<select id="g"><option>Mbalax</option><option>Afrobeats</option><option>Amapiano</option><option>Hip-hop</option><option>Drill</option><option>Coupé-décalé</option><option>Gospel</option></select>
<label for="k" data-k="kd"></label><select id="k"><option value="song" data-k="ks"></option><option value="beat" data-k="kb"></option></select>
<label for="bp" data-k="bpm"></label><input id="bp" type="number" min="40" max="220">
<label for="p" data-k="lp"></label><input id="p" type="number" min="100" step="50" value="1200" required>
<label for="pe" data-k="lpe"></label><input id="pe" type="number" min="100" step="50">
<p class="note" data-k="licn"></p>
<label for="f" data-k="af"></label><input id="f" type="file" accept="audio/*"><p class="note" data-k="afn"></p>
<button type="submit" data-k="sub"></button>
</form>
</section>
<footer data-k="foot"></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Cart">
<div id="cv"><h2 data-k="ct"></h2><div id="items"></div><p><strong id="total"></strong></p>
<button id="pay" data-k="pay" style="width:100%;background:var(--green);color:#fff"></button></div>
<div id="kv" hidden><h2 data-k="ck"></h2>
<label for="pm" data-k="pm"></label><select id="pm"><option>Wave</option><option>Orange Money</option><option>M-Pesa</option><option>MTN MoMo</option><option disabled data-k="card"></option></select>
<label for="ph" data-k="phl"></label><input id="ph" inputmode="tel" maxlength="20">
<button id="go" data-k="go" style="width:100%;margin-top:14px;background:var(--green);color:#fff"></button></div>
<div id="dv" hidden><h2 data-k="th"></h2><p id="rc"></p></div>
<p class="note" data-k="note"></p>
<button id="close" data-k="close" style="width:100%;margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--line)"></button>
</div>

<script>
var tracks=[
{id:1,t:"Ndank Ndank",a:"Awa Diop",c:"Sénégal",g:"Mbalax",p:1200},
{id:2,t:"Lagos Midnight",a:"Tunde B.",c:"Nigeria",g:"Afrobeats",p:1500},
{id:3,t:"Bongo Tempo",a:"Studio Thiès",c:"Sénégal",g:"Drill",p:14000,k:"beat",bp:140,pe:25000},
{id:4,t:"Jozi Nights",a:"Lerato M.",c:"Afrique du Sud",g:"Amapiano",p:1200},
{id:5,t:"Abidjan Vibes",a:"Kouassi J.",c:"Côte d'Ivoire",g:"Coupé-décalé",p:1200},
{id:6,t:"Paris-Dakar",a:"Binta K.",c:"France",g:"Hip-hop",p:1500},
{id:7,t:"Accra Sunrise",a:"Ama Owusu",c:"Ghana",g:"Afrobeats",p:1200},
{id:8,t:"Kora Trap",a:"Beats by Modou",c:"Sénégal",g:"Hip-hop",p:14000,k:"beat",bp:90,pe:20000}
];
var genres=["Tous","Beats","Mbalax","Afrobeats","Amapiano","Hip-hop","Drill","Coupé-décalé","Gospel"];
var lang="fr",cp=null,aud=null,AC=null,tmr=null,user=null,pend=null,cur="Tous",cart=[],nid=9,rate={XOF:1,EUR:1/655.957,USD:1/580},cc="XOF";
var $=function(i){return document.getElementById(i)};
var I={fr:{h1:"La musique africaine, vendue par ceux qui la font.",hp:"Du Sénégal à tout le continent et à la diaspora : chaque artiste fixe son prix et vend à des fans partout, de Dakar à Paris, Londres ou New York.",cur:"Devise",ah:"Artiste ou beatmaker ?",ap:"Africain ou de la diaspora, ajoutez un titre ou un beat en 30 secondes. Vous fixez le prix.",lt:"Titre",la:"Nom d'artiste",lc:"Pays",lg:"Genre",lp:"Prix (FCFA)",sub:"Publier mon titre",ct:"Votre panier",pay:"Passer au paiement",note:"Maquette : aucun argent n'est réellement débité.",ck:"Paiement",pm:"Moyen de paiement",phl:"Numéro de téléphone",go:"Confirmer le paiement",th:"Merci pour votre achat !",rc:"Commande",nph:"Entrez votre numéro de téléphone.",card:"Carte bancaire (bientôt)",listen:"Écouter l'aperçu",stop:"Arrêter",em:"Email",acct:"Continuer vers le paiement",rl:"Je suis",ra:"Artiste",rb:"Beatmaker",po:"Où recevoir vos paiements",pn:"Numéro de téléphone du compte (banque, Wave ou Orange Money)",pot:"Vos ventes seront versées sur ce numéro.",kd:"Type",ks:"Chanson",kb:"Beat (instrumental)",bpm:"BPM (optionnel)",beats:"Beats",minp:"Prix minimum d'une chanson : 1 200 FCFA.",minb:"Prix minimum d'un beat : 14 000 FCFA.",lic_n:"Non exclusif",lic_e:"Exclusif",lpe:"Prix exclusif (FCFA, beats seulement, facultatif)",licn:"Non exclusif : plusieurs acheteurs possibles. Exclusif : un seul acheteur, le beat est ensuite retiré de la vente.",rt:"Je certifie détenir les droits sur mes titres. La carte SODAV n'est pas obligatoire : tous les artistes sont les bienvenus.",fee:"Frais de création de compte, non remboursables :",payfee:"Payer les frais",acc:"Compte créé.",out:"Se déconnecter",as:"Connecté :",lnote:"Démo : le compte reste sur cet appareil, sans mot de passe.",af:"Fichier audio (aperçu de 30 s)",afn:"Le fichier reste sur cet appareil tant que la page est ouverte.",close:"Fermer",foot:"Maquette de démonstration. Titres et artistes fictifs. Les prix en euro et en dollar utilisent des taux indicatifs.",all:"Tous",add:"Ajouter au panier",inc:"Dans le panier",none:"Aucun titre dans ce genre. Soyez le premier à en publier un.",cart:"Panier",empty:"Votre panier est vide.",total:"Total :",addc:"Ajoutez un titre au panier.",nopay:"Maquette : paiement non activé pour l'instant.",pub:"Titre publié.",ttl:"Térou artistes – la musique africaine, vendue par ceux qui la font"},
en:{h1:"African music, sold by the people who make it.",hp:"From Senegal to the whole continent and the diaspora: every artist sets their own price and sells to fans everywhere, from Dakar to Paris, London or New York.",cur:"Currency",ah:"Artist or beatmaker?",ap:"African or from the diaspora, add a track or a beat in 30 seconds. You set the price.",lt:"Title",la:"Artist name",lc:"Country",lg:"Genre",lp:"Price (FCFA)",sub:"Publish my track",ct:"Your cart",pay:"Checkout",note:"Demo: no money is actually charged.",ck:"Payment",pm:"Payment method",phl:"Phone number",go:"Confirm payment",th:"Thank you for your purchase!",rc:"Order",nph:"Enter your phone number.",card:"Bank card (soon)",listen:"Play preview",stop:"Stop",em:"Email",acct:"Continue to payment",rl:"I am a",ra:"Artist",rb:"Beatmaker",po:"Where to receive your payments",pn:"Account phone number (bank, Wave or Orange Money)",pot:"Your sales will be paid out to this number.",kd:"Type",ks:"Song",kb:"Beat (instrumental)",bpm:"BPM (optional)",beats:"Beats",minp:"Minimum price for a song: 1,200 FCFA.",minb:"Minimum price for a beat: 14,000 FCFA.",lic_n:"Non-exclusive",lic_e:"Exclusive",lpe:"Exclusive price (FCFA, beats only, optional)",licn:"Non-exclusive: several buyers allowed. Exclusive: a single buyer, then the beat is removed from sale.",rt:"I certify that I hold the rights to my tracks. A SODAV card is not required: all artists are welcome.",fee:"Non-refundable account creation fee:",payfee:"Pay the fee",acc:"Account created.",out:"Sign out",as:"Signed in as",lnote:"Demo: the account stays on this device, no password.",af:"Audio file (30 s preview)",afn:"The file stays on this device while the page is open.",close:"Close",foot:"Demo version. Tracks and artists are fictional. Euro and dollar prices use indicative rates.",all:"All",add:"Add to cart",inc:"In cart",none:"No tracks in this genre yet. Be the first to publish one.",cart:"Cart",empty:"Your cart is empty.",total:"Total:",addc:"Add a track to your cart.",nopay:"Demo: payment is not enabled yet.",pub:"Track published.",ttl:"Térou artistes – African music, sold by the people who make it"}};
var CN={"Sénégal":"Senegal","Côte d'Ivoire":"Ivory Coast","Cameroun":"Cameroon","Afrique du Sud":"South Africa","Royaume-Uni":"United Kingdom","États-Unis":"United States","Autre":"Other"};
var countries=["Sénégal","Nigeria","Ghana","Côte d'Ivoire","Cameroun","Mali","Afrique du Sud","France","Royaume-Uni","États-Unis","Autre"];
function t(k){return I[lang][k]}
function cn(c){return lang==="en"&&CN[c]?CN[c]:c}
function buildC(){var v=$("c").value||"Sénégal";$("c").innerHTML=countries.map(function(c){return '<option value="'+esc(c)+'">'+esc(cn(c))+'</option>'}).join("");$("c").value=v}
function setLang(l){lang=l;document.documentElement.lang=l;document.title=t("ttl");document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=t(e.dataset.k)});$("lang").textContent=l==="fr"?"EN":"FR";buildC();chips();list();upd();showAcct()}
try{user=JSON.parse(localStorage.getItem("bba_user")||"null")}catch(x){}
function showAcct(){$("lf").hidden=!!user||!!pend;$("ap").hidden=!pend||!!user;$("me").hidden=!user;$("form").hidden=!user;if(user){$("who").textContent=t("as")+" "+user.name+" ("+user.email+")"+(user.pt?" – "+user.pt+" ••"+(user.pp||"").slice(-4):"");$("k").value=user.role==="beat"?"beat":"song";if(!$("a").value)$("a").value=user.name}}
function show(v){["cv","kv","dv"].forEach(function(i){$(i).hidden=i!==v})}
function sumC(){return cart.reduce(function(a,k){var q=k.split(":"),x=tracks.filter(function(t2){return t2.id===+q[0]})[0];return a+(q[1]==="e"?x.pe:x.p)},0)}
function stopP(){if(aud){aud.pause();aud=null}if(tmr){clearTimeout(tmr);tmr=null}if(AC){try{AC.close()}catch(x){}AC=null}cp=null;list()}
function hit(t0,f,g){var o=AC.createOscillator(),n=AC.createGain();o.type="sine";o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f/2,t0+.15);n.gain.setValueAtTime(g,t0);n.gain.exponentialRampToValueAtTime(.001,t0+.18);o.connect(n);n.connect(AC.destination);o.start(t0);o.stop(t0+.2)}
function playT(id){if(cp===id){stopP();return}stopP();cp=id;var x=tracks.filter(function(q){return q.id===id})[0];
if(x.src){aud=new Audio(x.src);aud.ontimeupdate=function(){if(aud&&aud.currentTime>=30)stopP()};aud.onended=stopP;aud.play().catch(function(){stopP()})}
else{try{var C=window.AudioContext||window.webkitAudioContext;AC=new C();var st=60/140/2,t0=AC.currentTime+.05;for(var i=0;i<32;i++){var k=i%16;if(k%8===0)hit(t0+i*st,110,.9);if(k===3||k===6||k===11||k===14)hit(t0+i*st,330,.5);if(k===5||k===13)hit(t0+i*st,440,.4)}tmr=setTimeout(stopP,7200)}catch(x2){cp=null}}
list()}
function fcfa(n){var v=n*rate[cc];if(cc==="XOF")return Math.round(v).toLocaleString(lang==="fr"?"fr-FR":"en-US")+" FCFA";return v.toLocaleString(lang==="fr"?"fr-FR":"en-US",{style:"currency",currency:cc,maximumFractionDigits:2})}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},2200)}
function chips(){$("chips").innerHTML="";genres.forEach(function(g){var b=document.createElement("button");b.className="chip";b.textContent=g==="Tous"?t("all"):g==="Beats"?t("beats"):g;b.setAttribute("aria-pressed",g===cur);b.onclick=function(){cur=g;chips();list()};$("chips").appendChild(b)})}
function btn(x,l,lab){var k=x.id+":"+l,inC=cart.indexOf(k)>-1;return '<button class="buy" aria-pressed="'+inC+'" data-c="'+k+'">'+(inC?t("inc"):lab)+'</button>'}
function list(){var h="";tracks.filter(function(x){return cur==="Tous"||(cur==="Beats"?x.k==="beat":x.g===cur)}).forEach(function(x){var two=x.k==="beat"&&x.pe,b=two?btn(x,"n",t("lic_n")+" – "+fcfa(x.p))+btn(x,"e",t("lic_e")+" – "+fcfa(x.pe)):btn(x,"n",t("add"));
h+='<div class="track"><div><h3>'+esc(x.t)+'</h3><div class="meta">'+esc(x.a)+' – '+esc(cn(x.c))+' – '+esc(x.g)+(x.k==="beat"?" – Beat"+(x.bp?" "+x.bp+" BPM":""):"")+'</div></div><div class="price">'+(two?"":fcfa(x.p))+'</div><div><button class="play" data-p="'+x.id+'">'+(cp===x.id?t("stop"):t("listen"))+'</button></div><div class="bb">'+b+'</div></div>'});
$("list").innerHTML=h||'<p class="meta">'+t("none")+'</p>';
document.querySelectorAll(".play").forEach(function(b){b.onclick=function(){playT(+b.dataset.p)}});
document.querySelectorAll(".buy").forEach(function(b){b.onclick=function(){var k=b.dataset.c,q=k.split(":"),o=q[0]+":"+(q[1]==="n"?"e":"n"),oi=cart.indexOf(o);if(oi>-1)cart.splice(oi,1);var i=cart.indexOf(k);if(i>-1)cart.splice(i,1);else cart.push(k);list();upd()}})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function upd(){$("fee").textContent=$("fee2").textContent=t("fee")+" "+fcfa(500);$("cartBtn").textContent=t("cart")+" ("+cart.length+")";var s=0,h="";cart.forEach(function(k){var q=k.split(":"),x=tracks.filter(function(t2){return t2.id===+q[0]})[0],pr=q[1]==="e"?x.pe:x.p;s+=pr;h+='<div class="row"><span>'+esc(x.t)+(q[1]==="e"?" ("+t("lic_e")+")":"")+'</span><span>'+fcfa(pr)+'</span></div>'});$("items").innerHTML=h||'<p class="meta">'+t("empty")+'</p>';$("total").textContent=t("total")+" "+fcfa(s)}
$("cartBtn").onclick=function(){show("cv");$("sheet").classList.add("open")};
$("close").onclick=function(){$("sheet").classList.remove("open");show("cv")};
$("pay").onclick=function(){if(!cart.length){toast(t("addc"));return}show("kv")};
$("go").onclick=function(){if($("ph").value.trim().length<6){toast(t("nph"));return}var tot=fcfa(sumC()),m=$("pm").value;$("go").disabled=true;setTimeout(function(){$("rc").textContent=t("rc")+" TA-"+Math.floor(10000+Math.random()*90000)+" – "+tot+" – "+m;cart.forEach(function(k){if(k.split(":")[1]==="e"){var id=+k.split(":")[0];tracks=tracks.filter(function(q){return q.id!==id})}});cart=[];list();upd();show("dv");$("go").disabled=false},1200)};
$("lf").onsubmit=function(e){e.preventDefault();var pp=$("pp").value.trim();if(pp.length<6){toast(t("nph"));return}pend={name:$("ln").value.trim(),email:$("lm").value.trim(),role:$("rl").value,pt:$("pt").value,pp:pp};showAcct()};
function mm(){return["Wave","Orange Money"].indexOf($("apm").value)>-1}
$("apm").onchange=function(){var m=mm();$("aph").hidden=!m;$("aphl").hidden=!m};
